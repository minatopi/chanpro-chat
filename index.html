<!-- 
同じブラウザを開いている人と、連絡ができます。
また、履歴も残ります。

プログラムの改造はしないでください。
個人情報は入力しないでください
パスワードはハッシュ化されいるのでご安心下さい。
不安定な場合は再ログインしてください。
むやみにアカウントを作らないでください。
アイコンはURLだけにしてください。

ポイントは他の人と協力することで点を伸ばせます。
基本のポイントは普通に使っていたらたまっていきます。
roomの履歴は、私の設定次第、消えません。
ただし、room以外の履歴保存は、保証しません。
room以外の履歴は私の管理外です。履歴は消えないように
設定はしていますが、消える可能性もあります。
roomは履歴1000件保存可能で、画像は保存されません。
それ以外のチャットは、500件まで保存でき、画像も保存でき
ます。

今週の追加機能
・プロフィール追加
　アカウント設定からプロフィール設定
　今までの通報ページにプロフィール追加
・履歴保存
・ポイント追加←ポイント、今後改造予定

今できているポイント機能
・ポイントを指定した人にあげると、相手に自分の分が送ら
　れ、システムからその1/6がもらえる。
・ポイント稼ぎと検知したら、その文字数×2ポイント失う。

追加機能：
・アカウント式になりました。(つまり開発者がアカウントを管理できるようになった。)
・３回以上通報されたら、BANされます。
・参加者一覧できました。
・参加者一覧から通報できます。
・テーマカラー変更できるようになりました。
・写真追加できるようになりました。
・同じ名前のユーザー作れません。
・アイコン、自己紹介(プロフィール)が設定できるようになりました。


追加予定：
・返信機能
・AI(gpt-4o-mini)を使ったBANの警告
・supabaseを使ったroomの履歴保存
・現在始動中のチャットルーム
・セキュリティーアップ
・どれほどチャットしているか、BAN回数、AIによる分析に
　よってポイントを作る。そのポイントで称号をもらう。
-->

        function removeImageAndUrl(text) {

            // data:image削除
            text = text.replace(/data:image\/[^\s]+/g, "");

            // URL削除
            text = text.replace(
                /(https?:\/\/[^\s]+)/g,
                ""
            );

            return text.trim();

        }


        async function addPoints(text) {

            // 参加者が2人未満ならポイントなし
            if (Object.keys(members).length < 2) {
                return;
            }

            // 画像・URLを除去
            const cleanText = removeImageAndUrl(text);

            // テキストなしなら終了
            if ([...cleanText].length <= 0) {
                return;
            }

            const uid = clientId.replace("id-", "");


            // =========================
            // 連続文字ペナルティ判定
            // 5文字以上の連続を全箇所取得
            // =========================

            const repeatMatches = [...cleanText.matchAll(/(.)\1{4,}/g)];


            if (repeatMatches.length > 0) {

                let totalRepeatCount = 0;

                repeatMatches.forEach(match => {
                    totalRepeatCount += [...match[0]].length;
                });


                // 連続文字数合計 × 2
                const penalty = totalRepeatCount * 2;


                console.log(
                    "連続文字ペナルティ:",
                    repeatMatches.map(m => m[0]),
                    "合計:",
                    totalRepeatCount,
                    "減少:",
                    penalty
                );


                // 表示ポイント更新
                myProfile.points =
                    (myProfile.points || 0) - penalty;

                updatePointBar(myProfile.points);


                // DB保存
                await supabaseClient
                    .rpc(
                        "add_user_points",
                        {
                            userid: uid,
                            amount: -penalty
                        }
                    );


                // 通常ポイント加算しない
                return;
            }


            // =========================
            // 通常ポイント加算
            // =========================

            const count = [...cleanText].length;


            if (count <= 0) {
                return;
            }


            myProfile.points =
                (myProfile.points || 0) + count;


            updatePointBar(myProfile.points);


            await supabaseClient
                .rpc(
                    "add_user_points",
                    {
                        userid: uid,
                        amount: count
                    }
                );
        }

                    .sort((a, b) => a.time - b.time)
                    .forEach(msg => {

                            }),

        function createMessageContent(text) {

            const urlRegex =
                /(https?:\/\/[^\s]+|data:image\/[a-zA-Z0-9.+-]+;base64,[^\s]+)/g;


            const parts = text.split(urlRegex);

            const fragment = document.createDocumentFragment();


            parts.forEach(part => {


                if (urlRegex.test(part)) {


                    if (
                        part.startsWith("data:image/")
                        ||
                        /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(part)
                    ) {

                        const img =
                            document.createElement("img");


                        img.src = part;


                        img.style.width="150px";
                        img.style.height="150px";
                        img.style.objectFit="contain";
                        img.style.borderRadius="5px";
                        img.style.marginTop="5px";
                        img.style.display="block";
                        img.style.gap="10px";


                        fragment.appendChild(img);


                    } else {


                        const a =
                            document.createElement("a");


                        a.href = part;
                        a.target = "_blank";
                        a.textContent = part;


                        fragment.appendChild(a);

                    }


                } else {


                    fragment.appendChild(
                        document.createTextNode(part)
                    );


                }


            });


            return fragment;

            const file = event.target.files[0];

            if (!file)

            const img = new Image();

            const reader = new FileReader();


            reader.onload = function (e) {

                img.onload = function () {

        function compressImage(img) {

            const canvas =
                document.createElement("canvas");


            let width = img.width;
            let height = img.height;


            // 最大サイズ
            const maxSize = 1200;


            if (width > maxSize || height > maxSize) {

                if (width > height) {

                    height =
                        height * maxSize / width;

                    width = maxSize;

                } else {

                    width =
                        width * maxSize / height;

                    height = maxSize;

                }

            }


            canvas.width = width;
            canvas.height = height;


            const ctx =
                canvas.getContext("2d");


            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );



            let quality = 0.9;

            let result;



            while (true) {


                result =
                    canvas.toDataURL(
                        "image/jpeg",
                        quality
                    );


                const size =
                    result.length * 0.75;



                console.log(
                    "圧縮:",
                    Math.round(size / 1024),
                    "KB",
                    "品質:",
                    quality
                );



                // 200KB以下なら終了
                if (size <= 200 * 1024) {

                    break;

                }


                quality -= 0.05;



                // 品質最低
                if (quality <= 0.1) {

                    break;

                }

            }



            const finalSize =
                result.length * 0.75;



            // それでも500KB超ならさらに縮小
            if (finalSize > 500 * 1024) {

                canvas.width *= 0.7;
                canvas.height *= 0.7;


                const ctx2 =
                    canvas.getContext("2d");


                ctx2.drawImage(
                    img,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                result =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.1
                    );

            }



            const size =
                result.length * 0.75;



            if (size > 500 * 1024) {

                showChatNotify(
                    "画像を500KB以下にできませんでした",null
                );

                imageData = null;
                return;

            }



            imageData = result;

            showImagePreview(result);

            console.log(
                "送信サイズ:",
                Math.round(size / 1024),
                "KB"
            );

        }

        async function hashPassword(password) {

            const data =
                new TextEncoder()
                    .encode(password);


            const hash =
                await crypto.subtle.digest(
                    "SHA-256",
                    data
                );


            return Array.from(
                new Uint8Array(hash)
            )
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");

        }

    const notify={
        id:data.id || crypto.randomUUID(),
        msg:data.msg,
        time:data.time||Date.now()
    };

    notificationHistoryIds[notify.id]=true;

    developerNotifications.unshift(notify);

    if(developerNotifications.length>50){
        developerNotifications.pop();
    }

    // 表示だけ
    showChatNotify("開発者: "+data.msg,"開発者通知");
}

  if(latestError){console.log("Supabase最新id取得失敗",latestError);return}
  const supabaseMaxId=latest?latest.id:0;
  if(supabaseMaxId<=lastSyncedSupabaseId){console.log("差分なし Supabase最新id:",supabaseMaxId,"同期済み:",lastSyncedSupabaseId);return}
  console.log("差分取得: Supabase id >",lastSyncedSupabaseId,"最新:",supabaseMaxId);
  // last_id 以降の差分を取得
  const{data:diff,error:diffError}=await supabaseClient.from("room_chat_history").select("*").gt("id",lastSyncedSupabaseId).order("id",{ascending:!0}).limit(1e3);
  if(diffError){console.log("差分取得エラー",diffError);return}
  if(diff&&diff.length>0){
    for(const row of diff){
      const rowTime=new Date(row.created_at).getTime();
      // Retainキャッシュ内のライブメッセージ(UUIDキー)と重複回避
      const dup=Object.values(history).some(m=>m.name===row.username&&m.msg===row.message&&Math.abs((m.time||0)-rowTime)<5000);
      if(dup)continue;
      history[msg.msgId] = msg;
      if(history[id])continue;
      history[id]=msg;
        const msg = {
            msgId: row.msg_id,
            id: row.user_id,
            name: row.username,
            msg: row.message,
            time: rowTime,
            replyTo: row.reply_to
        };
      await addMsg(msg.name,msg.msg,msg.id===clientId,msg.time,chat,msg.id);
    }
    chat.scrollTop=chat.scrollHeight;
  }
  lastSyncedSupabaseId=supabaseMaxId;
  // キャッシュを最新化して Retain に保存
  saveRetainHistory();
}

async function updateLoginStreak(userId){

    const {data,error}=await supabaseClient
        .from("users")
        .select("login_streak,last_login_date,points")
        .eq("id",userId)
        .single();

    if(error || !data)return;


    const today=new Date();
    const todayStr=today.toISOString().slice(0,10);

    let streak=data.login_streak||0;
    let bonusPoint=0;


    // 連続ログイン週ボーナス
    const weeks = Math.floor(streak / 7);
    
    if(weeks > 0 && streak % 7 === 0){
    
        const weekBonus = weeks * 10;
    
        bonusPoint += weekBonus;
    
        showChatNotify(
            "🔥 "+streak+"日連続ログイン達成！ +" + weekBonus + "ポイント",
            "連続ログインボーナス"
        );
    }


    if(data.last_login_date){

        const last=new Date(data.last_login_date);

        const diff=Math.floor(
            (today-last)/(1000*60*60*24)
        );


        if(diff===1){
            streak++;
        }
        else{
            streak=1;
        }

    }else{

        streak=1;

    }


    const newPoints=(data.points||0)+bonusPoint;


    await supabaseClient
        .from("users")
        .update({
            login_streak:streak,
            last_login_date:todayStr,
            points:newPoints
        })
        .eq("id",userId);


    if(bonusPoint>0){
        showChatNotify(
            "今日のログインボーナス 5ポイント",
            "ログインボーナス"
        );
    }


    const box=document.getElementById("loginStreak");

    if(box){
        box.innerText="連続ログイン "+streak+"日";
    }


    return streak;
}

function renderPins(){
  const panel=getPinsPanel();
  const header=document.getElementById("pinsHeader");
  const body=document.getElementById("pinsBody");
  const ids=Object.keys(pins);
  header.textContent="📌 ピン留め: "+ids.length+"件 (クリックで展開)";
  if(ids.length===0){panel.style.display="none";body.innerHTML="";syncPinButtons();return}
  panel.style.display="block";
  body.innerHTML="";
  ids.sort((a,b)=>(pins[b].pinnedAt||0)-(pins[a].pinnedAt||0)).forEach(msgId=>{
    const p=pins[msgId];
    const row=document.createElement("div");
    row.style.cssText="padding:5px 0;border-bottom:1px dashed #ffe58f";
    const uns=document.createElement("span");
    uns.textContent="✕";
    uns.style.cssText="float:right;color:#b00020;cursor:pointer;font-weight:bold;margin-left:6px";
    uns.onclick=function(ev){ev.stopPropagation();togglePin(msgId,p.name,p.raw||"",p.time)};
    const line=document.createElement("div");
    line.style.cssText="font-weight:bold;color:#594100;white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
    line.textContent=(p.name||"")+":";
    const txt=document.createElement("div");
    txt.style.cssText="color:#5a4a00;white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
    txt.textContent=p.text||"";
    row.appendChild(uns);row.appendChild(line);row.appendChild(txt);
    row.onclick=function(){
      const target=document.getElementById("msg-"+msgId);
      if(target){target.scrollIntoView({behavior:"smooth",block:"center"});target.style.transition="box-shadow .4s";target.style.boxShadow="0 0 0 3px #ffd54f";setTimeout(()=>{target.style.boxShadow=""},1200)}
      else showChatNotify("元のメッセージが見つかりません",null)
    };
    body.appendChild(row)
  });
  syncPinButtons();
}

// 全メッセージのピンボタン表示を現在の pins 状態に合わせる
function syncPinButtons(){
  document.querySelectorAll(".pinBtn").forEach(btn=>{
    const wrap=btn.closest(".message-wrap");
    if(!wrap)return;
    const mid=wrap.dataset.msgid;
    const pinned=!!(mid&&pins[mid]);
    btn.style.color=pinned?"#e67e22":"";
    btn.style.opacity=pinned?"1":".55";
  });
}

function savePinsRetain(){
  if(!client)return;
  const arr=Object.values(pins);
  client.publish(`chanpro-chat/${userRoom}/pins`,JSON.stringify(arr),{qos:1,retain:!0});
}

// Retainで届いたピン一覧を受信(更新後の復元)
function receiveRetainPins(list){
  pins={};
  if(Array.isArray(list))list.forEach(p=>{if(p&&p.msgId)pins[p.msgId]=p});
  renderPins();
}

function togglePin(msgId,name,rawText,time){
  if(!msgId)return;
  if(pins[msgId]){
    delete pins[msgId];
  }else{
    pins[msgId]={msgId:msgId,name:name,text:truncateForReply(rawText),raw:truncateForReply(rawText),time:time||Date.now(),pinnedBy:userName,pinnedAt:Date.now()};
  }
  savePinsRetain();
  renderPins();
}

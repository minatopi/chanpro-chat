<style>
body {
    font-family: sans-serif;
    background: #eef0f3;
    display: flex;
    justify-content: center;
}


#app {
    width: 420px;
    margin-top: 20px;
}



/* チャット表示 */

#chat {

    height: 420px;

    overflow-y: auto;

    background: white;

    padding: 10px;

    border-radius: 10px;

    border: 1px solid #ddd;
    position:relative;
}





/* システムメッセージ */

.system {

    background: transparent;

    color: #777;

    text-align: center;

    font-weight: normal;

    padding: 4px;

    margin: 8px 0;

}





/* メッセージ全体 */

.message-wrap {

    display: flex;

    flex-direction: column;

    width: fit-content;

    max-width: 75%;

    margin: 6px 0;

}





/* 自分のメッセージ */

.message-wrap.me {

    margin-left: auto;

    align-items: flex-end;

}





/* 吹き出し */

.msg {

    padding: 8px;

    border-radius: 10px;

    background: #e8f1ff;

    word-break: break-word;

    width: fit-content;

    max-width: 100%;

}





/* 自分側吹き出し */

.msg.me {

    background: #d9ffd9;

}





/* 時間 */

.time {

    font-size: 11px;

    color: #999;

    margin-top: 2px;

    padding: 0 4px;

}





/* 自分の時間 */

.time.me {

    text-align: right;

}





/* 相手の時間 */

.time.other {

    text-align: left;

}





/* 上部 */

#top{
    display:flex;
    align-items:center;
    gap:6px;
    position:relative;
}





/* 入力欄 */

input {

    flex: 1;

    padding: 8px;

    border-radius: 8px;

    border: 1px solid #ccc;

}





/* ボタン */

button {

    padding: 8px;

    border: none;

    border-radius: 8px;

    background: #4a7dff;

    color: white;

    cursor: pointer;

}



button:disabled {

    background: #aaa;

    cursor: not-allowed;

}

#main{
    display:flex;
    gap:15px;
}

#left{
    width:420px;
    position:relative;
}

#memberPanel{
    width:180px;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    height:520px;
    box-sizing:border-box;
}

#memberPanel h3{
    margin-top:0;
    font-size:16px;
    border-bottom:1px solid #ddd;
    padding-bottom:6px;
}

#memberList{
    list-style:none;
    padding:0;
    margin:0;
}

#memberList li{
    padding:6px 0;
    border-bottom:1px solid #eee;
}
#themeMenu{
    display:none;
    position:absolute;
    top:35px;
    left:0;
    background:white;
    padding:8px;
    border-radius:10px;
    border:1px solid #ddd;
    gap:6px;
    z-index:100;
}


.theme{
    width:45px;
    height:35px;
    border-radius:8px;
    border:none;
    color:white;
    cursor:pointer;
}


.theme.blue{
    background:#4a7dff;
}


.theme.green{
    background:#39a852;
}


.theme.red{
    background:#ff6666;
}


.theme.dark{
    background:#333;
}
#loginMessage{

    color:#ff3333;

    font-size:14px;

    margin-top:8px;

    min-height:20px;

}
body.dark input::placeholder{
    color:#aaa;
}
.date-divider{
    text-align:center;
    margin:15px 0;
}

.date-divider span{
    display:inline-block;
    background:#d9d9d9;
    color:#555;
    padding:4px 12px;
    border-radius:12px;
    font-size:12px;
    font-weight:bold;
}
#profile{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:200px;
}
#pointBox{
    width:120px;
    margin-left:auto;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    transform:translateY(-40px);
}

#pointText{
    font-size:12px;
    color:#555;
    margin-bottom:3px;
}

#pointBarBg{
    width:120px;
    height:10px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

#pointBar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#4a7dff,#74c4ff);
    border-radius:20px;
    transition:width .5s ease;
}
#chat{
    position:relative;
}
:root{
    --theme-color:#5dade2;
    --account-color:#e74c3c;
    --profile-color:#3498db;

    --notify-color:#4a7dff;
}

body.dark{
    --profile-color:#8ab4f8;
    --account-color:#8b0000;

    --notify-color:#8b0000;
}


#chatNotify{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    width:600px;
    max-width:90vw;
    display:flex;
    flex-direction:column;
    gap:8px;
    pointer-events:none;
}


.chat-notify{
    background:color-mix(
        in srgb,
        var(--notify-color) 80%,
        transparent
    );

    color:white;

    padding:14px 25px;
    border-radius:14px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.35);

    text-align:center;
    font-size:14px;

    backdrop-filter:blur(5px);

    animation:
        slideDown .35s ease,
        fadeOut .35s ease 2.8s forwards;
}


.chat-notify.success{
    background:rgba(40,160,70,.92);
}


.chat-notify.error{
    background:rgba(220,50,50,.92);
}


@keyframes slideDown{

    from{
        opacity:0;
        transform:translateY(-50px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


@keyframes fadeOut{

    from{
        opacity:1;
    }

    to{
        opacity:0;
        transform:translateY(-30px);
    }

}
.profile-button{
    background:var(--profile-color);
}


.account-button{
    background:var(--account-color);
}
.profile-level{
    margin-top:10px;
    font-weight:bold;
    font-size:16px;
}


.profile-bar-bg{

    width:200px;

    height:12px;

    background:#ddd;

    border-radius:10px;

    overflow:hidden;

    margin-top:8px;
    margin:8px auto 0;
}


.profile-bar{

    height:100%;

    background:linear-gradient(
        90deg,
        #4a7dff,
        #74c4ff
    );

    border-radius:10px;

    transition:.3s;

}


.profile-point-text{

    font-size:12px;

    margin-top:4px;

    color:#666;

}
</style>
</head>

let currentTheme = "blue";


function changeTheme(type){

    if(!themes[type]) return;

    currentTheme = type;

    const t = themes[type];


    // 背景
    document.body.style.background = t.body;


    // チャット
    const chatBox = document.getElementById("chat");
    if(chatBox){
        chatBox.style.background = t.panel;
    }


    // 参加者パネル
    const panel = document.getElementById("memberPanel");
    if(panel){
        panel.style.background = t.panel;
        panel.style.color = t.text;
    }


    // 入力欄
    [
        "msg",
        "setName",
        "setPassword",
        "setRoom"
    ].forEach(id=>{
    
        const input = document.getElementById(id);
    
        if(input){
    
            input.style.background = t.input;
            input.style.color = t.text;
            input.style.borderColor =
                type==="dark" ? "#666" : "#ccc";
    
        }
    
    });


    // 既存メッセージ
    document.querySelectorAll(".msg").forEach(e=>{

        if(e.classList.contains("me")){
            e.style.background = t.me;
        }else{
            e.style.background = t.other;
        }

        e.style.color = t.text;

    });



    // 時間表示
    document.querySelectorAll(".time").forEach(e=>{
        e.style.color =
        type==="dark" ? "#bbbbbb" : "#999999";
    });



    // システムメッセージ
    document.querySelectorAll(".system").forEach(e=>{
        e.style.color =
        type==="dark" ? "#bbbbbb" : "#777777";
    });



    // ボタン
    document.querySelectorAll("button").forEach(e=>{

        // テーマ選択ボタンは変更しない
        if(e.classList.contains("theme"))
            return;


        // 送信ボタン
        if(e.id==="sendButton"){

            // ダーク時は藍色固定
            if(type==="dark"){
                e.style.background="#3949ab";
            }else{
                e.style.background=t.button;
            }

            return;
        }


        e.style.background=t.button;

    });



    // 参加者リスト
    document.querySelectorAll("#memberList li").forEach(e=>{
        e.style.color=t.text;

        if(type==="dark"){
            e.style.borderColor="#555";
        }else{
            e.style.borderColor="#eee";
        }
    });



    // メニュー
    const menu=document.getElementById("themeMenu");

    if(menu){
        menu.style.background =
        type==="dark" ? "#303134" : "#ffffff";
    }


    // 全体文字
    document.body.style.color=t.text;
    document.querySelectorAll("input").forEach(e=>{

    e.style.background = t.input;
    e.style.color = t.text;

    if(type==="dark"){
        e.style.border = "1px solid #666";
    }else{
        e.style.border = "1px solid #ccc";
    }
    document.documentElement.style.setProperty(
    "--notify-color",
    t.button
);

});
}

    let deviceKey =
    localStorage.getItem("deviceKey");


    if(!deviceKey){

        deviceKey =
        crypto.randomUUID();

        localStorage.setItem(
            "deviceKey",
            deviceKey
        );

    }



    // 既存ユーザー検索

    .from("users")
    .select("id")
    .eq(
        "device_key",

    )
    .single();



    // BAN確認
    if(data.ban_until){

        new Date(data.ban_until).getTime();
        
        
        const now =
        Date.now();
        console.log(

        );
        
        console.log(

            new Date(data.ban_until).toString()
        );        
        
        console.log(

        );
        
        
        if(
            banTime > now
        ){
        
            const remain =
            Math.ceil(
                (banTime - now)
                /
                60000
            );
        
        
            console.log(
                "BAN中",

            );
        
        
            isBanned=true;
        
        
            showChatNotify(

        }
    
    }

    };

        "ログイン成功",
        "#22aa22"
    );
    myProfile.icon_url=data.icon_url || "";
    myProfile.profile=data.profile || "";
    
    
    return data.id;
}
// 開始

async function startChat(){
    const userId = await loginUser();

    if(!userId){
        return;
    }

    userName =
        document.getElementById("setName")
        .value.trim();


    userRoom =
        document.getElementById("setRoom")
        .value.trim();
    document.getElementById("top").style.display = "flex";

    if(!userName || !userRoom){

        showChatNotify("入力してください");
        return;

    }



    clientId =
        "id-" + userId;
    const {data:userData,error}=await supabaseClient
    .from("users")
    .select("icon_url,profile,username,points")
    .eq("id",userId)
    .single();
        
    if (userData) {
        myProfile = {
            icon_url: userData.icon_url || "",
            profile: userData.profile || "",
            points: userData.points || 0
        };
    
        userName = userData.username || userName;
    }


    document.getElementById("users")
    .innerText =
    "接続中…";



    started = true;



    document.getElementById("setup")
    .style.display="none";


    document.getElementById("top")
    .style.display="block";


    document.getElementById("profile")
    .innerText=
    `${userName} / ${userRoom}`;




    client = mqtt.connect(
    
        "wss://broker.hivemq.com:8884/mqtt",
    
        {
    
            clientId: clientId,
    
            clean:true,
    
    
            // 接続維持（秒）
            keepalive:30,
    
    
            // 接続タイムアウト
            connectTimeout:10000,
    
    
            // 自動再接続
            reconnectPeriod:3000,
    
    
            will:{
    
                topic:
                `chanpro-chat/${userRoom}/offline`,
    
    
                payload:
                JSON.stringify({
    
                    id:clientId,
    
                    name:userName,
    
                    type:"offline"
    
                }),
    
    
                qos:1,
    
                retain:false
    
            }
    
        }
    
    );





    client.on("connect",async ()=>{


        console.log("MQTT connected");



        client.subscribe(

            `chanpro-chat/${userRoom}/#`,

            {
                qos:1
            }

        );



        nameConflict=false;

        nameCheckFinished=false;



        // 名前確認

        client.publish(

            `chanpro-chat/${userRoom}/namecheck`,

            JSON.stringify({

                type:"check",

                id:clientId,

                name:userName

            }),

            {

                qos:1

            }

        );



        /*
            名前確認待ち
            2秒固定
        */

        setTimeout(async ()=>{
        
            nameCheckFinished = true;
        
        
            if(nameConflict){
        
                showChatNotify("同じユーザー名がすでに使用されています");
        
                client.end(true);
        
                location.reload();
        
                return;
        
            }
        
        
            // 履歴取得
            await loadOrSyncHistory();
            
            await new Promise(resolve=>setTimeout(resolve,500));           
            pendingJoinMessages=[];
            
            
            knownMembers[clientId]=true;
            
            
            // 自分の参加通知
            addMsg(
                "システム",
                `${userName}さんが参加しました`,
                false,
                Date.now()
            );
        
        
            announce();
        
        
            const sendButton=document.getElementById("sendButton");
        
            if(sendButton){
        
                sendButton.disabled=false;
        
            }
        
        
            startBanWatcher();
        
        
            document.getElementById("users").innerText="読み込み完了";
        
        
        },1000);


    });






    client.on(

        "message",

        receiveMQTT

    );

    client.on("reconnect",()=>{
    
        document.getElementById("users")
        .innerText="再接続中…";
    
    });

// MQTT受信

async function receiveMQTT(topic,message){


    let data;


    try{

        data =
        JSON.parse(
            message.toString()
        );

    }catch(e){

        return;

    }



    if(topic.endsWith("/msg")){

        receiveMessage(data);

    }



    if(topic.endsWith("/sync")){

        syncMessage(data);

    }


    if(topic.endsWith("/namecheck")){
    
    
        if(data.type==="check"
           &&
           data.name===userName
           &&
           data.id!==clientId){
    
    
            client.publish(
    
                `chanpro-chat/${userRoom}/namecheck`,
    
                JSON.stringify({
    
                    type:"conflict",
    
                    id:data.id,
    
                    name:userName
    
                }),
    
                {
                    qos:1
                }
    
            );
    
        }
    
    
    
        if(data.type==="conflict"
           &&
           data.name===userName){
        
            nameConflict=true;
        
        }
    
    
    }
    if(topic.endsWith("/point")){
    
        // 自分宛てだけ処理
        if(data.target !== clientId) return;
    
    
        const uid=clientId.replace("id-","");
    
    
        // DBへ追加
        await supabaseClient.rpc(
            "add_user_points",
            {
                userid:uid,
                amount:data.amount
            }
        );
    
    
        // 表示ポイント更新
        myProfile.points=
            (myProfile.points || 0)
            + data.amount;
    
    
        updatePointBar(myProfile.points);
    
    
        // 他人へ反映
        client.publish(
            `chanpro-chat/${userRoom}/presence`,
            JSON.stringify({
                id:clientId,
                name:userName,
                icon_url:myProfile.icon_url || "",
                profile:myProfile.profile || "",
                points:myProfile.points,
                time:Date.now()
            }),
            {qos:0}
        );
    
    
        showChatNotify(
            data.fromName+
            "さんから"+
            data.amount+
            "ポイントが送信されました"
        );
    }
    if(topic.endsWith("/presence")){
    
    
        if(data.id!==clientId && !knownMembers[data.id]){
    
    
            knownMembers[data.id]=true;
    
    
            if(historyLoading){
    
                // 履歴読み込み中なら保存
                pendingJoinMessages.push(data);
    
    
            }else{
    
    
                addMsg(
                    "システム",
                    `${data.name}さんが参加しました`,
                    false,
                    Date.now()
                );
    
    
            }
    
        }
    
    
        members[data.id]={
         name:data.name,
         icon_url:data.icon_url || "",
         profile:data.profile || "",
         points:data.points || 0,
         time:Date.now()
        };
        if(data.id === clientId){
            myProfile.points = data.points || 0;
            updatePointBar(myProfile.points);
        }
    
        showMembers();
    
    }




    if(topic.endsWith("/offline")){


        const id=data.id;


        if(!members[id])
            return;



        const name =
        members[id].name
        ||
        data.name;



        delete members[id];

        delete knownMembers[id];



        addMsg(

            "システム",

            `${name}さんが退出しました`,

            false,

            Date.now()

        );



        showMembers();


    }
    if(topic.endsWith("/report")){
    
    
        if(!data.deviceId)
            return;
    
    
    
        const reportKey =
        data.deviceId
        +
        "_"
        +
        data.target;
    
    
    
        // 同じ端末の重複防止
    
        if(reports[reportKey])
            return;
    
    
    
        reports[reportKey]=data;
    
    
    
        if(!reports[data.target]){
    
            reports[data.target]=[];
    
        }
    
    
    
        reports[data.target]
        .push(data);
    
    
    
        console.log(
            "通報:",
            data
        );
    
    
    
        const count =
        reports[data.target].length;
    
    
    
        console.log(
            "通報数:",
            count
        );
    if(count>=3){banUser(data.target,data.name);}}
    if(topic.endsWith("/ban")){
    
    
        if(bannedUsers[data.id])
            return;
    
    
        bannedUsers[data.id]=data;
    
    
        addMsg(
            "システム",
            `${t}さんがBANされました (${minutes}分)`,
            false,
            Date.now()
        );
    
    
        if(data.id===clientId){
    
            isBanned=true;
    
            document.getElementById("sendButton")
            .disabled=true;
    
        }
    
    }
    if(topic.endsWith("/kick")){
    
        if(data.id===clientId){
    
            addMsg(
                "システム",
                "管理者により退出されました",
                false,
                Date.now()
            );
    
    
            if(client){
                client.end(true);
                client=null;
            }
    
    
            showChatNotify(
                "管理者により退出されました"
            );
    
    
            location.reload();
        }
    
    }

}

function removeImageAndUrl(text){

    // data:image削除
    text=text.replace(/data:image\/[^\s]+/g,"");

    // URL削除
    text=text.replace(
        /(https?:\/\/[^\s]+)/g,
        ""
    );

    return text.trim();

}


async function addPoints(text){

  // 参加者が2人未満ならポイントなし
  if(Object.keys(members).length < 2){
    return;
  }

  // 画像・URLを除去
  const cleanText = removeImageAndUrl(text);

  // テキストなしなら終了
  if([...cleanText].length <= 0){
    return;
  }

  const uid = clientId.replace("id-","");


  // =========================
  // 連続文字ペナルティ判定
  // 5文字以上の連続を全箇所取得
  // =========================

  const repeatMatches = [...cleanText.matchAll(/(.)\1{4,}/g)];


  if(repeatMatches.length > 0){

    let totalRepeatCount = 0;

    repeatMatches.forEach(match => {
      totalRepeatCount += [...match[0]].length;
    });


    // 連続文字数合計 × 2
    const penalty = totalRepeatCount * 2;


    console.log(
      "連続文字ペナルティ:",
      repeatMatches.map(m => m[0]),
      "合計:",
      totalRepeatCount,
      "減少:",
      penalty
    );


    // 表示ポイント更新
    myProfile.points =
      (myProfile.points || 0) - penalty;

    updatePointBar(myProfile.points);


    // DB保存
    await supabaseClient
      .rpc(
        "add_user_points",
        {
          userid: uid,
          amount: -penalty
        }
      );


    // 通常ポイント加算しない
    return;
  }


  // =========================
  // 通常ポイント加算
  // =========================

  const count = [...cleanText].length;


  if(count <= 0){
    return;
  }


  myProfile.points =
    (myProfile.points || 0) + count;


  updatePointBar(myProfile.points);


  await supabaseClient
    .rpc(
      "add_user_points",
      {
        userid: uid,
        amount: count
      }
    );
}

function createMessageContent(text){

    const urlRegex =
    /(https?:\/\/[^\s]+|data:image\/[a-zA-Z0-9.+-]+;base64,[^\s]+)/g;


    const parts = text.split(urlRegex);

    const fragment = document.createDocumentFragment();


    parts.forEach(part=>{


        if(urlRegex.test(part)){


            if(
                part.startsWith("data:image/")
                ||
                /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(part)
            ){

                const img =
                document.createElement("img");


                img.src = part;


                img.style.maxWidth = "250px";
                img.style.maxHeight = "250px";
                img.style.borderRadius = "10px";
                img.style.marginTop = "5px";
                img.style.display = "block";


                fragment.appendChild(img);


            }else{


                const a =
                document.createElement("a");


                a.href = part;
                a.target="_blank";
                a.textContent = part;


                fragment.appendChild(a);

            }


        }else{


            fragment.appendChild(
                document.createTextNode(part)
            );


        }


    });


    return fragment;

}

function loadImage(event){

    if(!file)
        return;


    const img = new Image();

    const reader = new FileReader();


    reader.onload=function(e){

        img.onload=function(){

            compressImage(img);

        };

        img.src=e.target.result;

    };

}
function compressImage(img){

    const canvas =
    document.createElement("canvas");


    let width = img.width;
    let height = img.height;


    // 最大サイズ
    const maxSize = 1200;


    if(width > maxSize || height > maxSize){

        if(width > height){

            height =
            height * maxSize / width;

            width=maxSize;

        }else{

            width =
            width * maxSize / height;

            height=maxSize;

        }

    }


    canvas.width=width;
    canvas.height=height;


    const ctx =
    canvas.getContext("2d");


    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );



    let quality = 0.9;

    let result;



    while(true){


        result =
        canvas.toDataURL(
            "image/jpeg",
            quality
        );


        const size =
        result.length * 0.75;



        console.log(
            "圧縮:",
            Math.round(size/1024),
            "KB",
            "品質:",
            quality
        );



        // 200KB以下なら終了
        if(size <= 200 * 1024){

            break;

        }


        quality -= 0.05;



        // 品質最低
        if(quality <= 0.1){

            break;

        }

    }



    const finalSize =
    result.length * 0.75;



    // それでも500KB超ならさらに縮小
    if(finalSize > 500 * 1024){

        canvas.width *= 0.7;
        canvas.height *= 0.7;


        const ctx2 =
        canvas.getContext("2d");


        ctx2.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );


        result =
        canvas.toDataURL(
            "image/jpeg",
            0.1
        );

    }



    const size =
    result.length * 0.75;



    if(size > 500 * 1024){

        showChatNotify(
            "画像を500KB以下にできませんでした"
        );

        imageData=null;
        return;

    }



    imageData=result;
    
    showImagePreview(result);

    console.log(
        "送信サイズ:",
        Math.round(size/1024),
        "KB"
    );

}

async function hashPassword(password){

    const data =
    new TextEncoder()
    .encode(password);


    const hash =
    await crypto.subtle.digest(
        "SHA-256",
        data
    );


    return Array.from(
        new Uint8Array(hash)
    )
    .map(b=>b.toString(16).padStart(2,"0"))
    .join("");

}

    if(!username || !password){

        showChatNotify("入力してください");

        return null;

    }



    const hash =
    await hashPassword(password);



    const {data,error}=

    await supabaseClient
    .from("users")
    .select(
    "id,ban_until,ban_count,icon_url,profile,points"
    )
    .eq(
        "username",
        username
    )
    .eq(
        "password_hash",
        hash
    )
    .maybeSingle();



    if(error){

        console.error(error);

        showChatNotify(error.message);

        return null;

    }



    if(!data){

        showLoginMessage(
            "ユーザー名またはパスワードが違います"
        );

        return null;

    }



    // BAN確認追加

    if(
        data.ban_until
        &&
        new Date(data.ban_until) > new Date()
    ){


        const remain = Math.ceil(

            (
                new Date(data.ban_until)
                -
                new Date()

            )
            /
            60000

        );


        showLoginMessage(

            `BAN中です。残り${remain}分`

        );


        return null;

    }



    showLoginMessage(

        "ログイン成功",

        "#22aa22"

    );


    return data.id;

}

async function checkBanStatus(){

    if(!clientId) return;

    const userId = clientId.replace("id-","");

    const {data,error}=await supabaseClient
        .from("users")
        .select("ban_until")
        .eq("id",userId)
        .single();

    if(error || !data) return;


    if(data.ban_until){

        const banTime=new Date(data.ban_until);
        const now=new Date();

        if(banTime > now){

            if(!isBanned){

                isBanned=true;

                const btn=document.getElementById("sendButton");
                if(btn) btn.disabled=true;


                addMsg(
                    "システム",
                    "BANされています。チャットを利用できません",
                    false,
                    Date.now()
                );


                if(client){
                    client.end();
                    client=null;
                }

            }

        }
    }
}

function isValidURL(url){

 try{
    const u=new URL(url);

    return (
      u.protocol==="http:" ||
      u.protocol==="https:"
    );

 }catch(e){

    return false;

 }

}

async function givePoint(){

    if(!selectedProfile) return;

    const amount=parseInt(
        document.getElementById("givePointAmount").value
    );

    if(!amount || amount<=0){
        showPointMessage("ポイント数を入力してください");
        return;
    }


    // 自分自身は禁止
    if(selectedProfile.id===clientId){
        showPointMessage("自分には送れません");
        return;
    }


    const uid=clientId.replace("id-","");
    const targetUid=selectedProfile.id.replace("id-","");


    // 自分のポイント確認
    const {data:me,error:meError}=await supabaseClient
    .from("users")
    .select("points")
    .eq("id",uid)
    .single();


    if(meError || !me){
        showPointMessage("ポイント取得失敗");
        return;
    }


    if((me.points || 0) < amount){
        showPointMessage("ポイントが足りません");
        return;
    }


    // 相手へ加算
    await supabaseClient.rpc(
        "add_user_points",
        {
            userid:targetUid,
            amount:amount
        }
    );


    // 自分は半分返還（切り捨て）
    const back=Math.floor(amount/2);

    const selfChange=-amount+back;


    await supabaseClient.rpc(
        "add_user_points",
        {
            userid:uid,
            amount:selfChange
        }
    );


    // 自分の表示更新
    myProfile.points=
        (myProfile.points || 0)+selfChange;

    updatePointBar(myProfile.points);


    // 通知
    client.publish(
        `chanpro-chat/${userRoom}/presence`,
        JSON.stringify({
            id:clientId,
            name:userName,
            icon_url:myProfile.icon_url || "",
            profile:myProfile.profile || "",
            points:myProfile.points,
            time:Date.now()
        }),
        {qos:0}
    );
    client.publish(
        `chanpro-chat/${userRoom}/point`,
        JSON.stringify({
            from:clientId,
            fromName:userName,
            target:selectedProfile.id,
            amount:amount,
            time:Date.now()
        }),
        {qos:1}
    );

    showPointMessage(
        selectedProfile.name+
        "さんに"+
        amount+
        "ポイント送りました"
    );


    document.getElementById("givePointAmount").value="";
}

    const box=document.getElementById("pointMessage");

    box.innerText=text;

    setTimeout(()=>{

}

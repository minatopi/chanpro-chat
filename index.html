↑ポイントのランキング表

連続ログイン、8/7から開始

同じブラウザを開いている人と、連絡ができます。
また、履歴も残ります。

プログラムの改造はしないでください。
個人情報は入力しないでください
パスワードはハッシュ化されいるのでご安心下さい。
不安定な場合は再ログインしてください。
むやみにアカウントを作らないでください。
アイコンはURLだけにしてください。

ポイントは他の人と協力することで点を伸ばせます。
基本のポイントは普通に使っていたらたまっていきます。
roomの履歴は、私の設定次第、消えません。
ただし、room以外の履歴保存は、保証しません。
room以外の履歴は私の管理外です。履歴は消えないように
設定はしていますが、消える可能性もあります。
roomは履歴1000件保存可能で、画像は保存されません。
それ以外のチャットは、500件まで保存でき、画像も保存でき
ます。

今週の追加機能
・プロフィール追加
　アカウント設定からプロフィール設定
　今までの通報ページにプロフィール追加
・履歴保存
・ポイント追加←ポイント、今後改造予定

　れ、システムからその1/6がもらえる。
・ポイント稼ぎと検知したら、その文字数×2ポイント失う。

追加機能：
・アカウント式になりました。(つまり開発者がアカウントを管理できるようになった。)
・３回以上通報されたら、BANされます。
・参加者一覧できました。
・参加者一覧から通報できます。
・テーマカラー変更できるようになりました。
・写真追加できるようになりました。
・同じ名前のユーザー作れません。
・アイコン、自己紹介(プロフィール)が設定できるようになりました。


追加予定：
・返信機能
・AI(gpt-4o-mini)を使ったBANの警告
・supabaseを使ったroomの履歴保存
・現在始動中のチャットルーム

        // MQTT受信

        async function receiveMQTT(topic, message) {


            let data;


            try {

                data =
                    JSON.parse(
                        message.toString()
                    );

            } catch (e) {

                return;

            }
            if (
                topic ===
                `chanpro-settings/user/${encodeURIComponent(userName)}`
            ) {

                try {

                    const settings =
                        JSON.parse(message.toString());


                    if (typeof settings.soundEnabled === "boolean") {
                        soundEnabled = settings.soundEnabled;
                    }
                    else {
                        soundEnabled = false;
                    }

                    if (typeof settings.soundVolume === "number") {
                        soundVolume = settings.soundVolume;
                        receiveSound.volume = soundVolume;
                    }


                    const toggle =
                        document.getElementById("receiveSoundToggle");

                    if (toggle) {
                        toggle.checked = soundEnabled;
                    }


                    const volume =
                        document.getElementById("receiveSoundVolume");

                    if (volume) {
                        volume.value = soundVolume;
                    }


                    console.log(
                        "設定復元:",
                        settings
                    );

                } catch (e) {
                    console.log(
                        "設定読み込み失敗",
                        e
                    );
                }

                return;
            }
            // 開発者からの個別通知
            if (topic === `chanpro-dev/user/${clientId.replace("id-", "")}`) {

                console.log(
                    "開発者通知受信:",
                    data
                );


                if ("developer_message" === data.type) {

                    // 不要な通知を破棄
                    if (data.msg === "通知内容") {
                        console.log("不要通知を無視:", data.msg);
                        return;
                    }

                    const notify = {
                        id: crypto.randomUUID(),
                        msg: data.msg,
                        time: data.time || Date.now()
                    };

                    addDeveloperNotification(notify);

                    saveDeveloperNotificationHistory();
                }

                return;
            }


            if (topic.endsWith("/msg")) {

                receiveMessage(data);

            }



            if (topic.endsWith("/sync")) {

                syncMessage(data);

            }
            if (topic.endsWith("/delete")) {
                handleRemoteDelete(data);
                return;
            }

        function removeImageAndUrl(text) {

            // data:image削除
            text = text.replace(/data:image\/[^\s]+/g, "");

            );

        async function addPoints(text) {

            // 参加者が2人未満ならポイントなし
            if (Object.keys(members).length < 2) {
                return;
            }

            // 画像・URLを除去
            const cleanText = removeImageAndUrl(text);

            // テキストなしなら終了
            if ([...cleanText].length <= 0) {
                return;
            }

            const uid = clientId.replace("id-", "");


            // =========================
            // 連続文字ペナルティ判定
            // 5文字以上の連続を全箇所取得
            // =========================

            const repeatMatches = [...cleanText.matchAll(/(.)\1{4,}/g)];


            if (repeatMatches.length > 0) {

                let totalRepeatCount = 0;

                repeatMatches.forEach(match => {
                    totalRepeatCount += [...match[0]].length;
                });


                // 連続文字数合計 × 2
                const penalty = totalRepeatCount * 2;


                console.log(
                    "連続文字ペナルティ:",
                    repeatMatches.map(m => m[0]),
                    "合計:",
                    totalRepeatCount,
                    "減少:",
                    penalty
                );


                // 表示ポイント更新
                myProfile.points =
                    (myProfile.points || 0) - penalty;

                updatePointBar(myProfile.points);


                // DB保存
                await supabaseClient
                    .rpc(
                        "add_user_points",
                        {
                            userid: uid,
                            amount: -penalty
                        }
                    );


                // 通常ポイント加算しない
                return;
            }


            // =========================
            // 通常ポイント加算
            // =========================

            const count = [...cleanText].length;


            if (count <= 0) {
                return;
            }


            myProfile.points =
                (myProfile.points || 0) + count;


            updatePointBar(myProfile.points);


            await supabaseClient
                .rpc(
                    "add_user_points",
                    {
                        userid: uid,
                        amount: count
                    }
                );
        }

        function requestSync() {

        // 同期処理

        function syncMessage(data) {

            if (data.type === "request") {

                Object.values(history)
                    .sort((a, b) => a.time - b.time)
                    .forEach(msg => {

                        client.publish(
                            `chanpro-chat/${userRoom}/sync`,
                            JSON.stringify({
                                type: "send",
                                target: data.id,
                                data: msg
                            }),
                            { qos: 1 }
                        );

                    });

            }


            if (data.type === "send") {

                if (data.target !== clientId) return;

                // すぐ表示しない
                syncBuffer.push(data.data);

                // タイマーを延長
                clearTimeout(syncTimer);

                syncTimer = setTimeout(() => {

                    // 時刻順に並べる
                    syncBuffer.sort((a, b) => a.time - b.time);

                    // 表示
                    syncBuffer.forEach(msg => {
                        receiveMessage(msg);
                    });

                    // バッファを空にする
                    syncBuffer = [];

                    syncFinished = true;

                }, 500);

            }
        }

        function createMessageContent(text) {

            const urlRegex =
                /(https?:\/\/[^\s]+|data:image\/[a-zA-Z0-9.+-]+;base64,[^\s]+)/g;


            const parts = text.split(urlRegex);

            const fragment = document.createDocumentFragment();


            parts.forEach(part => {


                if (urlRegex.test(part)) {


                    if (
                        part.startsWith("data:image/")
                        ||
                        /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(part)
                    ) {

                        const img =
                            document.createElement("img");


                        img.src = part;


                        img.style.width = "150px";
                        img.style.height = "150px";
                        img.style.objectFit = "contain";
                        img.style.borderRadius = "5px";
                        img.style.marginTop = "5px";
                        img.style.display = "block";
                        img.style.gap = "10px";


                        fragment.appendChild(img);


                    } else {


                        const a =
                            document.createElement("a");


                        a.href = part;
                        a.target = "_blank";
                        a.textContent = part;


                        fragment.appendChild(a);

                    }


                } else {


                    fragment.appendChild(
                        document.createTextNode(part)
                    );


                }


            });


            return fragment;

        }
        async function getUserIcon(name, senderId = null) {
            const PLACEHOLDER = "https://placehold.jp/40x40.png";

            // キャッシュ
            if (iconCache[name]) {
                return iconCache[name];
            }

            // 自分
            if (name === userName && myProfile.icon_url) {
                iconCache[name] = myProfile.icon_url;
                return myProfile.icon_url;
            }

            // 参加中メンバー
            for (const member of Object.values(members)) {
                if (member.name === name && member.icon_url) {
                    iconCache[name] = member.icon_url;
                    return member.icon_url;
                }
            }

            // Supabase検索
            const { data, error } = await supabaseClient
                .from("users")
                .select("icon_url")
                .eq("username", name)
                .maybeSingle();

            if (!error && data?.icon_url) {
                iconCache[name] = data.icon_url;
                return data.icon_url;
            }

            iconCache[name] = PLACEHOLDER;
            return PLACEHOLDER;
        }

function loadImage(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;

    imageData = [];

    let loaded = 0;

    files.forEach(file => {
        if (!file.type.startsWith("image/")) {
            loaded++;
            return;
        }

        const img = new Image();
        const reader = new FileReader();

        reader.onload = function(ev) {
            img.onload = function() {
                compressImage(img);
                loaded++;
            };

            img.src = ev.target.result;
        };

        reader.readAsDataURL(file);
    });
}
        function compressImage(img) {

            const canvas =
                document.createElement("canvas");


            let width = img.width;
            let height = img.height;


            // 最大サイズ
            const maxSize = 1200;


            if (width > maxSize || height > maxSize) {

                if (width > height) {

                    height =
                        height * maxSize / width;

                    width = maxSize;

                } else {

                    width =
                        width * maxSize / height;

                    height = maxSize;

                }

            }


            canvas.width = width;
            canvas.height = height;


            const ctx =
                canvas.getContext("2d");


            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );



            let quality = 0.9;

            let result;



            while (true) {


                result =
                    canvas.toDataURL(
                        "image/jpeg",
                        quality
                    );


                const size =
                    result.length * 0.75;



                console.log(
                    "圧縮:",
                    Math.round(size / 1024),
                    "KB",
                    "品質:",
                    quality
                );



                // 200KB以下なら終了
                if (size <= 200 * 1024) {

                    break;

                }


                quality -= 0.05;



                // 品質最低
                if (quality <= 0.1) {

                    break;

                }

            }



            const finalSize =
                result.length * 0.75;



            // それでも500KB超ならさらに縮小
            if (finalSize > 500 * 1024) {

                canvas.width *= 0.7;
                canvas.height *= 0.7;


                const ctx2 =
                    canvas.getContext("2d");


                ctx2.drawImage(
                    img,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                result =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.1
                    );

            }



            const size =
                result.length * 0.75;



            if (size > 500 * 1024) {

                showChatNotify(
                    "画像を500KB以下にできませんでした", null
                );

                imageData = [];
                return;

            }



            imageData.push(result);

            showImagePreview(result);

            console.log(
                "送信サイズ:",
                Math.round(size / 1024),
                "KB"
            );

        }

        async function hashPassword(password) {

            const data =
                new TextEncoder()
                    .encode(password);


            const hash =
                await crypto.subtle.digest(
                    "SHA-256",
                    data
                );


            return Array.from(
                new Uint8Array(hash)
            )
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");

        }

        async function syncRoomHistoryFromSupabase() {
            if ("room" !== userRoom) return;
            // Supabase の最新 id を取得
            const { data: latest, error: latestError } = await supabaseClient.from("room_chat_history").select("id").order("id", { ascending: !1 }).limit(1).maybeSingle();
            if (latestError) { console.log("Supabase最新id取得失敗", latestError); return }
            const supabaseMaxId = latest ? latest.id : 0;
            if (supabaseMaxId <= lastSyncedSupabaseId) { console.log("差分なし Supabase最新id:", supabaseMaxId, "同期済み:", lastSyncedSupabaseId); return }
            console.log("差分取得: Supabase id >", lastSyncedSupabaseId, "最新:", supabaseMaxId);
            // last_id 以降の差分を取得
            const { data: diff, error: diffError } = await supabaseClient.from("room_chat_history").select("*").gt("id", lastSyncedSupabaseId).order("id", { ascending: !0 }).limit(1e3);
            if (diffError) { console.log("差分取得エラー", diffError); return }
            if (diff && diff.length > 0) {
                for (const row of diff) {
                    const rowTime = new Date(row.created_at).getTime();
                    const msg = {
                        msgId: row.msg_id,
                        id: row.user_id,
                        name: row.username,
                        msg: row.message,
                        time: rowTime,
                        replyTo: row.reply_to
                    };
                    // Retainキャッシュ内のライブメッセージ(UUIDキー)と重複回避
                    const dup = Object.values(history).some(m => m.name === msg.name && m.msg === msg.msg && Math.abs((m.time || 0) - msg.time) < 5000);
                    if (dup) continue;
                    if (history[msg.msgId]) continue;
                    history[msg.msgId] = msg;
                    await addMsg(msg.name, msg.msg, msg.id === clientId, msg.time, chat, msg.id, msg.msgId, msg.replyTo);
                }
                chat.scrollTop = chat.scrollHeight;
            }
            lastSyncedSupabaseId = supabaseMaxId;
            // キャッシュを最新化して Retain に保存
            saveRetainHistory();
        }

━━━━━━━━━━━━━━━━━━━━━━
【サービス概要】
━━━━━━━━━━━━━━━━━━━━━━

chanpro-Chatは、ブラウザ上で動作するリアルタイムチャットサービスです。

主な構成要素：

・HTML
・CSS
・JavaScript
・Supabase
・MQTT
・HiveMQ MQTT Broker

リアルタイム通信にはMQTTを使用しています。

MQTT接続先はコード上では、

wss://broker.hivemq.com:8884/mqtt

です。

チャットルームごとにMQTTトピックを分けています。

基本的なチャットトピックは、

chanpro-chat/{room}/

です。

ユーザーはアカウントを作成またはログインし、
ユーザー名とチャットルーム名を入力してチャットに参加します。

━━━━━━━━━━━━━━━━━━━━━━
【ログイン画面】
━━━━━━━━━━━━━━━━━━━━━━

ログイン画面には以下があります。

・ユーザー名
・パスワード
・参加するチャット
・使い方
・新規作成
・ログイン

「使い方」を押すとAIサポート画面が開きます。

「新規作成」で新しいユーザーアカウントを作成できます。

「ログイン」で既存アカウントへログインできます。

━━━━━━━━━━━━━━━━━━━━━━
【ユーザー登録】
━━━━━━━━━━━━━━━━━━━━━━

新規作成では、

・ユーザー名
・パスワード

が必要です。

どちらかが空の場合、
「入力してください」
と表示されます。

パスワードはJavaScriptのSHA-256を使用してハッシュ化され、
password_hashとして保存されます。

ユーザー名がすでに存在する場合、
Supabaseの一意制約エラーコード23505を確認し、
「このユーザー名はすでに使われています」
と表示します。

ユーザー登録成功後は、
「ユーザー作成完了」
が表示され、そのままログイン処理が開始されます。

━━━━━━━━━━━━━━━━━━━━━━
【ログイン】
━━━━━━━━━━━━━━━━━━━━━━

ログインには、

・ユーザー名
・パスワード

が必要です。

ユーザー名とパスワードが一致するユーザーをSupabaseから検索します。

パスワードはSHA-256に変換してから比較されます。

ログインに成功すると、

「ログイン成功」

が表示されます。

ユーザーが存在しない、
またはパスワードが一致しない場合、

「ユーザー名またはパスワードが違います」

と表示されます。

ログイン時にBAN期限が残っている場合はログインできません。

BAN中は、

「BAN中です。残り○分」

という表示になります。

━━━━━━━━━━━━━━━━━━━━━━
【チャットルーム】
━━━━━━━━━━━━━━━━━━━━━━

ログイン後、

・ユーザー名
・参加するチャット

を使用してチャットルームへ接続します。

チャットルーム名はユーザーが入力できます。

同じroom名のユーザー同士が、
同じMQTTトピックを利用してリアルタイム通信します。

初期値として入力欄には、

room

が入っています。

つまり「room」という部屋を利用することができます。

ただし、履歴をSupabaseのroom_chat_historyへ保存・同期する特別な処理は、
コード上では「room」というルーム名の場合に限定されています。

重要：

「room」以外のルームでもMQTTによるリアルタイムチャットは可能ですが、
Supabaseのroom_chat_historyを使った通常の履歴同期処理は「room」の場合だけ実行されます。

━━━━━━━━━━━━━━━━━━━━━━
【ユーザー名の重複】
━━━━━━━━━━━━━━━━━━━━━━

接続時にはMQTTのnamecheckトピックを使用して、
同じチャットルーム内で同じユーザー名が使用されていないか確認します。

同じユーザー名が検出された場合、

「同じユーザー名がすでに使用されています」

と表示され、接続を終了してページを再読み込みします。

したがって、
同じチャットルーム内で同じユーザー名を同時使用することは想定されていません。

━━━━━━━━━━━━━━━━━━━━━━
【リアルタイムメッセージ】
━━━━━━━━━━━━━━━━━━━━━━

通常のメッセージは、

chanpro-chat/{room}/msg

へMQTTで送信されます。

メッセージには主に以下の情報が含まれます。

・msgId
・id
・name
・icon_url
・profile
・points
・msg
・time
・replyTo

msgIdはcrypto.randomUUID()で生成されます。

同じmsgIdのメッセージを重複表示しないようにしています。

━━━━━━━━━━━━━━━━━━━━━━
【メッセージ送信方法】
━━━━━━━━━━━━━━━━━━━━━━

通常の送信手順：

1. 画面下部の入力欄にメッセージを入力する。
2. 必要なら画像やスタンプを追加する。
3. 「➤」送信ボタンを押す。

Enterキーでも送信できます。

ただしShift+Enterの場合は送信せず、
通常のEnter処理を行います。

送信ボタンはログイン・接続処理が完了するまで無効です。

━━━━━━━━━━━━━━━━━━━━━━
【メッセージ表示】
━━━━━━━━━━━━━━━━━━━━━━

自分のメッセージは右側寄りに表示され、
他ユーザーのメッセージは左側に表示されます。

メッセージには、

・ユーザーアイコン
・ユーザー名
・本文
・時刻
・返信ボタン
・ピン留めボタン

があります。

日付が変わった場合、
日付区切りが表示されます。

15分以上メッセージに、時間が空いた場合、
<hr>で区切りが表示されます。

日付形式は、

YYYY/MM/DD

です。

時刻形式は、

HH:MM

です。

━━━━━━━━━━━━━━━━━━━━━━
【画像送信】
━━━━━━━━━━━━━━━━━━━━━━

「＋」ボタンから画像を選択できます。

対応するinputは、

input type="file"

で、
acceptはimage/*です。

画像を選択すると自動的に圧縮処理されます。

画像の最大辺は基本的に1200px以下になるよう調整されます。

JPEG形式に変換されます。

圧縮処理では品質を下げながらサイズを調整します。

送信サイズが大きすぎる場合は、
さらに縮小を試みます。

それでも512KBを超える場合、

「画像を500KB以下にできませんでした」

と表示され、送信できません。

画像はメッセージ本文へdata:image/...形式で追加されます。

画像メッセージは画面上では画像として表示されます。

重要：

「画像は無制限に送れる」
とは説明しない。

画像にはサイズ制限があります。

━━━━━━━━━━━━━━━━━━━━━━
【画像プレビュー】
━━━━━━━━━━━━━━━━━━━━━━

画像を選択すると送信前にプレビューが表示されます。

プレビューには削除用の「×」ボタンがあります。

「×」を押すと、
送信予定の画像を取り消せます。

━━━━━━━━━━━━━━━━━━━━━━
【スタンプ】
━━━━━━━━━━━━━━━━━━━━━━

スタンプメニューは「☺︎」ボタンから開きます。

スタンプには、

・無料スタンプ
・ポイントで購入するスタンプ

があります。

スタンプ一覧は外部のstickers.jsonから読み込まれます。

スタンプには、

・name
・url
・price

などの情報があります。

無料スタンプはpriceが0です。

購入済みスタンプはユーザーのstamp_listにURLが保存されます。

━━━━━━━━━━━━━━━━━━━━━━
【スタンプ検索】
━━━━━━━━━━━━━━━━━━━━━━

スタンプメニューには検索欄があります。

検索文字列を入力すると、
スタンプ名にその文字列を含むものを絞り込みます。

大文字・小文字の違いを無視して検索します。

━━━━━━━━━━━━━━━━━━━━━━
【スタンプ購入】
━━━━━━━━━━━━━━━━━━━━━━

未購入の有料スタンプをクリックすると購入確認画面が開きます。

例：

「○○」を
○ポイントで購入しますか？

購入にはユーザーのポイントが必要です。

ポイントが不足している場合、

「ポイントが足りません」

と表示されます。

購入成功後は、

・ポイントを減らす
・stamp_listへスタンプURLを追加する
・ポイント表示を更新する

処理が行われます。

購入済みのスタンプは再購入せず使用できます。
取り消しはできません。報告で伝えると、取り消してくれることもあります。
━━━━━━━━━━━━━━━━━━━━━━
【ポイント】
━━━━━━━━━━━━━━━━━━━━━━

ポイントはユーザーごとに管理されます。

ポイントには主に以下の用途があります。

・メッセージ送信による獲得
・ログインボーナス
・連続ログインボーナス
・スタンプ購入
・他ユーザーへのポイント送信

━━━━━━━━━━━━━━━━━━━━━━
【メッセージによるポイント】
━━━━━━━━━━━━━━━━━━━━━━

通常のメッセージ送信では、
メッセージ本文から画像データとURLを除いた文字列の長さを利用してポイントを加算します。

文字数に応じてポイントが加算されます。

ただし、
同じ文字が5文字以上連続するパターンがある場合、
ポイント稼ぎ防止処理が動きます。

例えば、

aaaaa
11111
！！！！！
などのように、
同じ文字が5回以上連続する場合です。

その連続部分の文字数を合計し、
その2倍のポイントが減少します。

したがって、

「何文字送っても必ずプラスになる」

とは説明してはいけません。

また、
ユーザーが1人しかいない場合、
addPoints()の処理ではポイント加算処理を行いません。

━━━━━━━━━━━━━━━━━━━━━━
【ログインボーナス】
━━━━━━━━━━━━━━━━━━━━━━

ログイン時にはlogin_streakとlast_login_dateを使用して連続ログインを管理します。

その日にすでにログイン済みなら、
同じ日のログインボーナスは再付与されません。

通常のログインボーナスは、

+5ポイント

です。

7日連続ログイン達成時には追加で、

+10ポイント

が付与されます。

そのため7日目のボーナスは合計15ポイントです。

連続日数が途切れた場合は、
連続日数が1日から再スタートします。

画面には、

「連続ログイン ○日」

と表示されます。

━━━━━━━━━━━━━━━━━━━━━━
【レベル】
━━━━━━━━━━━━━━━━━━━━━━

レベルはポイントから計算されます。

基本的な計算は、

Lv. floor(points / 100) + 1

です。

ポイントの100の位ではなく、
100ポイントごとにレベルが1上がる仕組みです。

例：

0ポイント → Lv.1
99ポイント → Lv.1
100ポイント → Lv.2
199ポイント → Lv.2
200ポイント → Lv.3

プロフィール画面では、
現在レベルと100ポイント単位の進行状況が表示されます。

━━━━━━━━━━━━━━━━━━━━━━
【ランキング】
━━━━━━━━━━━━━━━━━━━━━━

ランキングはSupabaseのusersテーブルからpointsの降順で取得します。

一部の特定ユーザーIDはランキング対象から除外されます。

現在のコードでは以下のIDが除外対象です。

b2d3032f-b29e-42d9-a835-2b3c3289669f
5c0aef29-53e5-4f32-ab72-6505d71f887b

対象ユーザーの中でポイント順の順位を計算します。

画面には、

「順位: ○位」

と表示されます。

対象外の場合は、

「順位対象外」

と表示されます。

━━━━━━━━━━━━━━━━━━━━━━
【ポイントを他ユーザーへ送る】
━━━━━━━━━━━━━━━━━━━━━━

参加者一覧やプロフィールから、
他ユーザーのプロフィールを開けます。

プロフィールにはポイント送信用の入力欄があります。

自分自身にはポイントを送れません。

送信するポイントは1以上である必要があります。

自分のポイントが不足している場合は送れません。

ポイントを送ると、
送信者のポイントが減少し、
相手側へMQTT経由でポイント通知が送信されます。

受信側ではポイントが加算されます。

送信先ユーザーがオンラインで、
対象トピックを購読していることが前提になります。

━━━━━━━━━━━━━━━━━━━━━━
【プロフィール】
━━━━━━━━━━━━━━━━━━━━━━

参加者一覧のユーザーをクリックするとプロフィールを表示できます。

プロフィールには、

・アイコン
・ユーザー名
・自己紹介
・レベル
・ポイント進行状況

などが表示されます。

自分自身のプロフィールを開いた場合、
自分自身への通報ボタンは表示されません。

他ユーザーのプロフィールでは通報ボタンが表示されます。

━━━━━━━━━━━━━━━━━━━━━━
【アイコン】
━━━━━━━━━━━━━━━━━━━━━━

アイコンはURLで設定します。

設定画面の「アイコンURL」にURLを入力します。

httpまたはhttpsのURLだけが有効です。

不正なURLの場合、

「正しいアイコンURLを入力してください」

と表示されます。

画像ファイルそのものをアップロードする機能ではありません。

したがって、
「画像を選択すればアイコンにできる」
とは説明しない。

━━━━━━━━━━━━━━━━━━━━━━
【自己紹介】
━━━━━━━━━━━━━━━━━━━━━━

アカウント設定から自己紹介文を変更できます。

自己紹介はプロフィール画面に表示されます。

━━━━━━━━━━━━━━━━━━━━━━
【ユーザー名変更】
━━━━━━━━━━━━━━━━━━━━━━

アカウント設定から新しいユーザー名を入力して変更できます。

空欄の場合は、

「入力してください」

と表示されます。

変更成功時は、

「ユーザー名を変更しました」

と表示されます。

重要：

ユーザー名変更後、
現在の接続状態やMQTT購読トピックとの関係で、
すべての内部状態が完全に再接続されるとは限りません。

そのため、
「ユーザー名を変更すると完全に新しいセッションとして再接続される」
とは断定しない。

━━━━━━━━━━━━━━━━━━━━━━
【パスワード変更】
━━━━━━━━━━━━━━━━━━━━━━

アカウント設定から新しいパスワードを入力して変更できます。

空欄の場合は、

「入力してください」

と表示されます。

新しいパスワードはSHA-256でハッシュ化されて保存されます。

━━━━━━━━━━━━━━━━━━━━━━
【アカウント削除】
━━━━━━━━━━━━━━━━━━━━━━

アカウント設定からアカウント削除ができます。

削除前に確認画面が表示されます。

メッセージ：

「本当にアカウントを削除しますか？
この操作は元に戻せません」

OKを選択するとSupabaseのusersテーブルからユーザーを削除します。

成功すると、

「アカウントを削除しました」

と表示され、
MQTT接続を終了してページを再読み込みします。

重要：

アカウント削除は元に戻せない操作として扱う。

━━━━━━━━━━━━━━━━━━━━━━
【テーマ】
━━━━━━━━━━━━━━━━━━━━━━

画面上部の「▼」ボタンからテーマメニューを開けます。

テーマは4種類です。

・青
・緑
・赤
・黒

コード上のテーマ名は、

blue
green
red
dark

です。

テーマ変更では、

・背景
・パネル
・入力欄
・文字色
・境界線
・自分のメッセージ
・他人のメッセージ
・ボタン
・返信表示
・通知

などの色が変更されます。

━━━━━━━━━━━━━━━━━━━━━━
【通知音】
━━━━━━━━━━━━━━━━━━━━━━

アカウント設定には受信通知音設定があります。

設定可能：

・受信通知音ON/OFF
・音量

「▶ プレビュー」で通知音を試聴できます。

他ユーザーからメッセージを受信したとき、
soundEnabledがtrueなら通知音を再生します。

自分が送ったメッセージでは、
受信通知音を鳴らしません。

通知音が鳴らない場合は、

1. 通知音設定がONか確認
2. 音量が0になっていないか確認
3. ブラウザ側の音声再生制限を確認
4. ブラウザや端末の音量を確認

してください。

ブラウザによってはユーザー操作前の音声再生が制限される場合があります。

━━━━━━━━━━━━━━━━━━━━━━
【通知設定の保存】
━━━━━━━━━━━━━━━━━━━━━━

通知音設定は、

chanpro-settings/user/{username}

というMQTTトピックを使用して保存・復元します。

設定内容には、

・soundEnabled
・soundVolume
・time

が含まれます。

━━━━━━━━━━━━━━━━━━━━━━
【通知一覧】
━━━━━━━━━━━━━━━━━━━━━━

画面上部の「通知」ボタンから通知一覧を確認できます。

通知には、

・通知タイトル
・本文
・日時

などが表示されます。

通知は最大50件程度保持されます。

通知を削除すると、
ローカルの通知履歴配列から削除され、
通知履歴が保存されます。

重要：

現在のコードでは通知履歴の保存方式やページ更新時の復元方法に複数の経路があります。

そのため、
「通知は永久に保存される」
「どの端末でも必ず同じ通知が表示される」
とは断定しない。

━━━━━━━━━━━━━━━━━━━━━━
【開発者への報告】
━━━━━━━━━━━━━━━━━━━━━━

画面上部の「報告」ボタンから、
開発者へ改善点や要望を送信できます。

入力欄：

「改善点や要望を入力」

送信するとdeveloper_inboxへ保存されます。

送信成功時は、

「開発者へ送信しました」

と表示されます。

これは一般ユーザーへの通報とは別の機能です。

━━━━━━━━━━━━━━━━━━━━━━
【ユーザー通報】
━━━━━━━━━━━━━━━━━━━━━━

他ユーザーのプロフィールを開くと、
「通報」ボタンがあります。

通報対象を確認して送信します。

同じユーザーを同じ報告者が短時間に繰り返し通報することを防ぐため、
5分間の重複通報制御があります。

通報には主に、

・reporter
・deviceId
・target
・name
・time

が含まれます。

重要：

「通報したら必ず即BANされる」
とは説明しない。

通報はBAN処理につながる可能性がありますが、
コード上では一定条件が必要です。

━━━━━━━━━━━━━━━━━━━━━━
【BAN】
━━━━━━━━━━━━━━━━━━━━━━

現在のコードでは、
一定数の通報が集まった場合にbanUser()が呼び出されます。

コード上では3件以上の通報が条件です。

BAN回数に応じてBAN時間が変化します。

ban_countが1増加し、
BAN時間は、

5 × BAN回数

分です。

例：

1回目 → 5分
2回目 → 10分
3回目 → 15分

という計算です。

BAN時にはusersテーブルの、

・ban_count
・ban_until

が更新されます。

さらに100ポイント減少する処理があります。

BAN対象ユーザーにはMQTTでBAN情報が送信されます。

重要：

「3人が通報すれば必ずBAN」
という単純な説明だけでは不十分です。

コード上では重複通報防止や報告情報の管理があります。

━━━━━━━━━━━━━━━━━━━━━━
【BAN中のチャット】
━━━━━━━━━━━━━━━━━━━━━━

BAN中のユーザーはチャット利用が制限されます。

BAN中に送信しようとした場合、

「BANされています」

などの通知が表示されます。

BAN状態が確認された場合、
送信ボタンが無効化されることがあります。

定期的にBAN状態を確認する処理もあります。

確認間隔は基本的に60秒です。

━━━━━━━━━━━━━━━━━━━━━━
【参加者一覧】
━━━━━━━━━━━━━━━━━━━━━━

右側の「参加者」パネルには、
現在認識されている参加者が表示されます。

自分には、

「ユーザー名 (あなた)」

と表示されます。

他ユーザーの名前をクリックすると、
そのユーザーのプロフィールを開けます。

参加・退出はMQTTのpresence/offlineメッセージを利用します。

━━━━━━━━━━━━━━━━━━━━━━
【presence】
━━━━━━━━━━━━━━━━━━━━━━

オンライン状態を維持するため、
約1秒ごとにpresence情報を送信します。

presenceには、

・id
・name
・icon_url
・profile
・points
・time

などが含まれます。

これにより参加者一覧やポイント情報などを更新します。

━━━━━━━━━━━━━━━━━━━━━━
【退出】
━━━━━━━━━━━━━━━━━━━━━━

MQTTのoffline情報を受信すると、
対象ユーザーを参加者一覧から削除します。

退出時には、

「○○さんが退出しました」

というシステムメッセージが表示されます。

━━━━━━━━━━━━━━━━━━━━━━
【履歴】
━━━━━━━━━━━━━━━━━━━━━━

チャット履歴には複数の同期方法があります。

MQTTのretainを使用した履歴保存と、
Supabaseを利用したroom履歴があります。

特にroomというルームでは、
room_chat_historyテーブルを利用します。

保存対象には、

・username
・user_id
・message
・msg_id
・reply_to

などがあります。

重要：

画像については、
履歴保存時にdata:image/...部分を除去しています。

そのため、
履歴から復元されたメッセージで画像データが完全に復元されるとは限りません。

━━━━━━━━━━━━━━━━━━━━━━
【履歴同期】
━━━━━━━━━━━━━━━━━━━━━━

roomの場合、
Supabaseのroom_chat_historyから最新IDを取得し、
前回同期したIDより後のデータを取得します。

最大1000件まで差分取得します。

重複したように見えるメッセージについては、
ユーザー名・本文・時刻などを使って重複判定を行います。

通信状況によっては、
履歴読み込み中、
同期中、
再接続中
などの状態になることがあります。

━━━━━━━━━━━━━━━━━━━━━━
【再接続】
━━━━━━━━━━━━━━━━━━━━━━

MQTT接続が切れた場合、
自動的に再接続を試みます。

再接続中は、

「再接続中…」

と表示されます。

オフライン時は、

「通信待機中…」

と表示されます。

MQTTエラー時には、

「接続が拒否されています。更新をしてください。」

という表示が行われる場合があります。

━━━━━━━━━━━━━━━━━━━━━━
【メッセージ返信】
━━━━━━━━━━━━━━━━━━━━━━

各メッセージには「↩」返信ボタンがあります。

返信ボタンを押すと、
そのメッセージを対象に返信できます。

返信対象には、

・msgId
・name
・snippet

が保存されます。

入力欄の上に返信プレビューが表示されます。

返信プレビューには、
返信対象ユーザーと本文の一部が表示されます。

×ボタンを押すと返信状態を解除できます。

送信された返信には、
元メッセージへの返信情報が表示されます。

返信情報をクリックすると、
元のメッセージへスクロールします。

元メッセージが見つからない場合は、

「元のメッセージが見つかりません」

と表示されます。

━━━━━━━━━━━━━━━━━━━━━━
【ピン留め】
━━━━━━━━━━━━━━━━━━━━━━

各メッセージには📌ピン留めボタンがあります。

ピン留めすると、
メッセージがピン一覧に追加されます。

画面上部に、

「📌 ピン留め: ○件」

というパネルが表示されます。

ピン一覧をクリックすると、
ピン留めされたメッセージを確認できます。

ピンをクリックすると、
元のメッセージへ移動します。

ピン留め解除もできます。

ピン情報はMQTT retainを利用して保存されます。

重要：

「ピンはSupabaseのアカウント情報に保存される」
とは説明しない。

現在の実装ではMQTTのpinsトピックを利用しています。

━━━━━━━━━━━━━━━━━━━━━━
【システムメッセージ】
━━━━━━━━━━━━━━━━━━━━━━

参加・退出などのイベントでは、
通常のユーザーメッセージとは別にシステムメッセージが表示されます。

例：

「○○さんが参加しました」

「○○さんが退出しました」

「○○さんがBANされました」

などです。

━━━━━━━━━━━━━━━━━━━━━━
【プロフィールアイコン取得】
━━━━━━━━━━━━━━━━━━━━━━

メッセージ表示時には、
ユーザーのアイコンURLを利用します。

取得できない場合は、

https://placehold.jp/40x40.png

のプレースホルダーが使用されます。

プロフィール画面では、

https://placehold.jp/80x80.png

のプレースホルダーが使用されます。

━━━━━━━━━━━━━━━━━━━━━━
【AIサポート画面】
━━━━━━━━━━━━━━━━━━━━━━

「使い方」ボタンからAIサポート画面を開けます。

AI画面には、

・AIチャット履歴
・質問入力欄
・送信ボタン
・閉じるボタン

があります。

AIへ質問を送信すると、
ユーザーの質問がAI履歴に追加されます。

AIの回答も履歴に追加されます。

━━━━━━━━━━━━━━━━━━━━━━
【参加チャット】
━━━━━━━━━━━━━━━━━━━━━━
参加チャットは、認証されたものは選択肢として下に出てきます。
認証されていなくとも、そのまま参加できます。
参加チャットの選択肢は、
報告で、開発者に認証してもらうことで、選択肢に表示されるようになります。


━━━━━━━━━━━━━━━━━━━━━━
【AIの回答ルール】
━━━━━━━━━━━━━━━━━━━━━━

ユーザーが、

「メッセージを送るには？」
「画像は送れる？」
「スタンプはどう使う？」
「ポイントはどうやって増える？」
「プロフィールを変えたい」
「BANされた」
「通知音が鳴らない」
「通報したい」
「テーマを変えたい」
「返信したい」
「ピン留めしたい」

などと聞いた場合、
上記仕様に基づいて具体的に回答する。

━━━━━━━━━━━━━━━━━━━━━━
【操作案内の優先順位】
━━━━━━━━━━━━━━━━━━━━━━

ユーザーが操作方法を聞いた場合は、

1. どのボタンを押すか
2. 何を入力するか
3. 何が起きるか
4. うまくいかない場合の確認方法

の順番で説明する。

例えばメッセージ送信なら、

1. 下の入力欄を押す
2. メッセージを入力する
3. 「➤」を押す
4. メッセージがチャットに表示される

と説明する。

━━━━━━━━━━━━━━━━━━━━━━
【トラブルシューティング】
━━━━━━━━━━━━━━━━━━━━━━

■ ログインできない

以下を確認する。

・ユーザー名が正しいか
・パスワードが正しいか
・ユーザー登録が完了しているか
・BAN中ではないか
・通信状態に問題がないか

ユーザー名またはパスワードが間違っている場合は、
具体的な正しいパスワードをAIから確認することはできない。

パスワードをAIに送るよう要求しない。

━━━━━━━━━━━━━━━━━━━━━━
■ チャットにつながらない

以下を確認する。

・ユーザー名が入力されているか
・チャットルーム名が入力されているか
・インターネット接続
・MQTT接続
・ブラウザ状態
・ページ更新

「接続が拒否されています。更新をしてください。」
と表示されている場合は、
まずページ更新を案内する。

━━━━━━━━━━━━━━━━━━━━━━
■ メッセージが送れない

以下を確認する。

・ログイン済みか
・MQTT接続が確立しているか
・BANされていないか
・入力内容が空ではないか
・画像が大きすぎないか

━━━━━━━━━━━━━━━━━━━━━━
■ 履歴が見えない

以下を案内する。

1. 少し待つ
2. 通信状態を確認する
3. ページを更新する
4. 再ログインする

ただし、
「必ず復元される」とは断定しない。

━━━━━━━━━━━━━━━━━━━━━━
■ 通知音が鳴らない

以下を確認する。

1. アカウント設定を開く
2. 「受信通知音」がONか確認
3. 音量を確認
4. 「▶ プレビュー」で確認
5. ブラウザ・端末の音量を確認

ブラウザによる音声再生制限の可能性も説明する。

━━━━━━━━━━━━━━━━━━━━━━
■ スタンプが使えない

以下を確認する。

・スタンプメニューを開いているか
・無料スタンプか
・購入済みか
・ポイントが足りているか

有料スタンプは購入後に使用可能。

━━━━━━━━━━━━━━━━━━━━━━
■ ポイントが増えない

以下を確認する。

・メッセージ送信時の条件
・同じ文字の連続によるポイント稼ぎ防止
・参加者が1人だけではないか
・ログインボーナスがすでに付与済みではないか
・Supabaseへの保存に失敗していないか

「文字を送れば必ず1ポイント増える」
とは説明しない。

━━━━━━━━━━━━━━━━━━━━━━
■ BANされた

BAN中はチャット利用が制限される。

BAN時間はBAN回数によって変わる。

コード上では、

5 × BAN回数

        async function updateLoginStreak(userId) {
            try {
                const { data, error } = await supabaseClient
                    .from("users")
                    .select("login_streak, last_login_date, points")
                    .eq("id", userId)
                    .single();

                if (error) {
                    console.error("連続ログイン情報取得失敗:", error);
                    return 0;
                }

                if (!data) {
                    console.error("ユーザー情報がありません");
                    return 0;
                }

                // 今日の日付を YYYY-MM-DD で取得
                const now = new Date();
                const todayStr =
                    now.getFullYear() + "-" +
                    String(now.getMonth() + 1).padStart(2, "0") + "-" +
                    String(now.getDate()).padStart(2, "0");

                const lastDate = data.last_login_date
                    ? String(data.last_login_date).slice(0, 10)
                    : null;

                let streak = Number(data.login_streak) || 0;
                let bonusPoint = 0;

                // -----------------------------
                // 今日すでにログイン済み
                // -----------------------------
                if (lastDate === todayStr) {
                    console.log("今日はすでにログイン済み:", todayStr);

                    const box = document.getElementById("loginStreak");
                    if (box) {
                        box.innerText = "連続ログイン " + streak + "日";
                    }

                    return streak;
                }

                // -----------------------------
                // 初回ログイン
                // -----------------------------
                if (!lastDate) {
                    streak = 1;
                } else {
                    const last = new Date(lastDate + "T00:00:00");
                    const today = new Date(todayStr + "T00:00:00");

                    const diffDays = Math.round(
                        (today - last) / 86400000
                    );

                    // 前日もログインしている
                    if (diffDays === 1) {
                        streak++;
                    } else {
                        // 1日以上空いたのでリセット
                        streak = 1;
                    }
                }

                // -----------------------------
                // 毎日ログインボーナス +5P
                // -----------------------------
                const dailyBonus = 5;
                bonusPoint += dailyBonus;

                showChatNotify(
                    "🎁 今日のログインボーナス +" +
                    dailyBonus +
                    "ポイント",
                    "ログインボーナス"
                );

                // -----------------------------
                // 7日ごとの追加ボーナス +10P
                // -----------------------------
                if (streak % 7 === 0) {
                    const weeklyBonus = 10;
                    bonusPoint += weeklyBonus;

                    showChatNotify(
                        "🔥 " +
                        streak +
                        "日連続ログイン達成！ +" +
                        weeklyBonus +
                        "ポイント",
                        "連続ログインボーナス"
                    );
                }

                // -----------------------------
                // ポイント計算
                // -----------------------------
                const currentPoints = Number(data.points) || 0;
                const newPoints = currentPoints + bonusPoint;

                // -----------------------------
                // Supabaseへ保存
                // -----------------------------
                const { error: updateError } = await supabaseClient
                    .from("users")
                    .update({
                        login_streak: streak,
                        last_login_date: todayStr,
                        points: newPoints
                    })
                    .eq("id", userId);

                if (updateError) {
                    console.error(
                        "連続ログイン情報更新失敗:",
                        updateError
                    );

                    showChatNotify(
                        "ログインボーナスの保存に失敗しました",
                        "エラー"
                    );

                    return streak;
                }

                // -----------------------------
                // 自分のプロフィールポイントも更新
                // -----------------------------
                myProfile.points = newPoints;

                // -----------------------------
                // ポイントバー更新
                // -----------------------------
                if (typeof updatePointBar === "function") {
                    updatePointBar(newPoints);
                }

                // -----------------------------
                // 連続ログイン表示
                // -----------------------------
                const box = document.getElementById("loginStreak");

                if (box) {
                    box.innerText =
                        "連続ログイン " + streak + "日";
                }

                console.log("ログインボーナス付与成功:", {
                    userId: userId,
                    date: todayStr,
                    streak: streak,
                    dailyBonus: dailyBonus,
                    weeklyBonus: streak % 7 === 0 ? 10 : 0,
                    totalBonus: bonusPoint,
                    newPoints: newPoints
                });

function searchChatRooms(keyword) {
    const box = document.getElementById("roomSuggestions");

    if (!box) return;

    keyword = keyword.trim();

    if (!keyword) {
        box.innerHTML = "";
        box.style.display = "none";
        return;
    }

    // 全データから検索
    const results = allChatRooms
        .filter(room =>
            room.room_name &&
            room.room_name.toLowerCase().includes(keyword.toLowerCase())
        )
        .slice(0, 10);

    box.innerHTML = "";

    // 候補がない場合
    // → 何も表示せず、そのまま入力した名前を使える
    if (results.length === 0) {
        box.style.display = "none";
        return;
    }

    results.forEach(room => {
        const item = document.createElement("div");

        item.className = "room-suggestion";
        item.textContent = room.room_name;

        item.onclick = () => {
            selectedRoomName = room.room_name;

            const input = document.getElementById("setRoom");

            if (input) {
                input.value = room.room_name;
            }

            box.innerHTML = "";
            box.style.display = "none";
        };

        box.appendChild(item);
    });

    box.style.display = "block";
}

/* ------------------------------------------------------------
   2. SHA-256
   ※ これを必ず定義する
   ------------------------------------------------------------ */

async function sha256(text) {

  if (
    !window.crypto ||
    !window.crypto.subtle
  ) {
    throw new Error(
      "この環境ではcrypto.subtleが使用できません"
    );
  }

  const data =
    new TextEncoder().encode(text);

  const hash =
    await window.crypto.subtle.digest(
      "SHA-256",
      data
    );

  return Array
    .from(new Uint8Array(hash))
    .map(
      b =>
        b
          .toString(16)
          .padStart(2, "0")
    )
    .join("");
}

   * ② sessionStorage
   */

  const sessionKey =
    getSessionDeviceKey();

  if (sessionKey) {
    return sessionKey;
  }


  /*
   * ③ Storageが完全に使用不可
   *
   * sandbox環境ではここ
   */

  return null;
}


/* ------------------------------------------------------------
   6. Device Hash
   ------------------------------------------------------------ */

async function getDeviceHash() {

  const info =
    getDeviceInfo();

  const deviceKey =
    getDeviceKey();


  /*
   * Storageが使える場合だけ
   * deviceKeyを含める
   */

  if (deviceKey) {

    info.deviceKey =
      deviceKey;

  }


  /*
   * JSON文字列化
   */

  const raw =
    JSON.stringify(info);


  /*
   * SHA-256
   */

  return await sha256(raw);
}


/* ------------------------------------------------------------
   7. BAN確認
   ------------------------------------------------------------ */

async function isDeviceBanned() {

  try {

    const hash =
      await getDeviceHash();


    const { data, error } =
      await supabaseClient
        .from("banned_devices")
        .select(
          "id, reason"
        )
        .eq(
          "device_hash",
          hash
        )
        .maybeSingle();


    if (error) {

      console.error(
        "端末BAN確認エラー:",
        error
      );

      /*
       * BAN確認に失敗した場合、
       * とりあえずログイン処理自体は止める
       *
       * 必要ならここをbanned:trueにして
       * fail-closedにもできます。
       */

      return {
        banned: false,
        reason: null,
        hash
      };
    }


    if (data) {

      return {
        banned: true,
        reason:
          data.reason ||
          "この端末は使用できません",
        hash
      };

    }


    return {
      banned: false,
      reason: null,
      hash
    };

  } catch (e) {

    console.error(
      "端末BAN確認失敗:",
      e
    );

    return {
      banned: false,
      reason: null,
      hash: null
    };
  }
}


/* ------------------------------------------------------------
   8. ユーザー端末保存
   ------------------------------------------------------------ */

async function saveUserDevice(userId) {

  try {

    if (!userId) {
      return;
    }


    const hash =
      await getDeviceHash();


    const info =
      getDeviceInfo();


    const { error } =
      await supabaseClient
        .from("user_devices")
        .upsert(
          {
            user_id:
              userId,

            device_hash:
              hash,

            device_info:
              info,

            last_login_at:
              new Date().toISOString()
          },
          {
            onConflict:
              "user_id,device_hash"
          }
        );


    if (error) {

      console.error(
        "端末情報保存エラー:",
        error
      );

    } else {

      console.log(
        "端末情報を保存しました:",
        hash
      );

    }

  } catch (e) {

    console.error(
      "端末情報保存失敗:",
      e
    );
  }
}
